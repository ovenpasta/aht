name = "aht"
description = "Ada HTTP/WebSocket client with TLS via mbedTLS"
version = "0.1.0-dev"

long-description = """
An Ada 2022 library providing a synchronous HTTP/1.1 client and a
concurrent WebSocket (RFC 6455) client on top of a shared transport
layer, with TLS via mbedTLS. Public APIs carry Ada contracts; the
WebSocket client is exercised against the Autobahn|Testsuite
conformance harness.

Currently POSIX-only (Linux, macOS): the bundled mbedTLS build uses
pthreads. The first build downloads and compiles mbedTLS locally into
third_party/ (needs network, curl, tar, make, and a C compiler).
"""

authors = ["Aldo Nicolas Bruno"]
maintainers = ["ovenpasta@pizzahack.eu"]
maintainers-logins = ["ovenpasta"]
licenses = "Apache-2.0"
tags = ["http", "https", "websocket", "tls", "mbedtls", "client"]

project-files = ["aht.gpr"]

[available.'case(os)']
windows = false
'...' = true

[gpr-externals]
BUILD_MODE = ["debug", "release"]

[build-switches]
"*".ada_version = "Ada2022"
"*".contracts = "Yes"
"*".runtime_checks = "Everything"
"*".style_checks = "No"

[[actions]]
type = "pre-build"
command = ["sh", "scripts/fetch_mbedtls.sh"]
