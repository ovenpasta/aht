name = "aht"
description = "Ada HTTP/WebSocket client with TLS (OpenSSL or mbedTLS)"
version = "0.1.0-dev"

long-description = """
An Ada 2022 library providing a synchronous HTTP/1.1 client and a
concurrent WebSocket (RFC 6455) client on top of a shared transport
layer. Public APIs carry Ada contracts; the WebSocket client is
exercised against the Autobahn|Testsuite conformance harness.

TLS backends are selected at build time via the AHT_TLS_BACKEND
environment variable: the default links against the system OpenSSL 3
(libssl-dev / brew openssl@3); the alternative vendors mbedTLS 2.28,
downloaded and compiled on first build (needs network, curl, tar,
make, and a C compiler). Currently POSIX-only (Linux, macOS).
"""

authors = ["Aldo Nicolas Bruno"]
maintainers = ["ovenpasta@pizzahack.eu"]
maintainers-logins = ["ovenpasta"]
licenses = "Apache-2.0"
tags = ["http", "https", "websocket", "tls", "openssl", "mbedtls", "client"]

project-files = ["aht.gpr"]

[available.'case(os)']
windows = false
'...' = true

# Windows is not available yet, and the flag above is the only thing
# saying so. When it flips it does not become `windows = true`: the
# supported target is x86-64 specifically, since AHT_CROSS_TARGET
# defaults to x86_64-w64-mingw32 and scripts/fetch_mbedtls.sh refuses
# a toolchain whose -dumpmachine disagrees. An i686 MSYS2 would fail
# that check rather than build something wrong, but failing at the
# pre-build action is a worse way to learn it than not resolving. So
# the replacement is:
#
#   [available.'case(os)'.windows.'case(host-arch)']
#   x86_64 = true
#   '...'  = false
#
#   [available.'case(os)'.'...']
#   '...' = true
#
# Claiming any other Windows architecture means deriving its triplet
# rather than defaulting one, which nothing here does today.

[gpr-externals]
BUILD_MODE = ["debug", "release"]
AHT_TLS_BACKEND = ["openssl", "mbedtls"]
AHT_OS = ["posix", "windows"]

# Set for the BUILD ENVIRONMENT, which is not the same thing as
# [gpr-externals] above and is why both exist.
#
# A gpr external reaches the project file and nothing else. The
# pre-build action is a separate process, and it needs AHT_TLS_BACKEND
# to know whether to fetch mbedTLS at all and AHT_OS to know which
# per-target tree to build. Measured rather than assumed: a probe
# action printing its environment under `alr build` sees the variables
# set here, and sees AHT_TLS_BACKEND as UNSET when it is declared only
# as a gpr external.
#
# Windows only, deliberately. On Windows there is no choice to make --
# the openssl backend wants a system OpenSSL 3 that MSYS2 does not
# provide the way this build expects, so mbedtls is the backend and
# the Windows body of AHT.Random.Source is the only one that links.
# Elsewhere there IS a choice, and `.set` would overwrite it: pinning
# these on Linux or macOS would break `AHT_TLS_BACKEND=mbedtls alr
# build`, which is the documented way to select the other backend.
[environment.'case(os)'.windows]
AHT_OS.set = "windows"
AHT_TLS_BACKEND.set = "mbedtls"

[build-switches]
"*".ada_version = "Ada2022"
"*".contracts = "Yes"
"*".runtime_checks = "Everything"
"*".style_checks = "No"

[[actions]]
type = "pre-build"
command = ["sh", "scripts/fetch_mbedtls.sh"]
